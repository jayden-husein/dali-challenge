# Render Blueprint: one web service + one Postgres, wired together.
services:
  - type: web
    name: dali-challenge
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Deploy only after GitHub checks (the Test workflow) pass on the commit.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dali-db
          property: connectionString
databases:
  - name: dali-db
    plan: free
